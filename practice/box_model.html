<!DOCTYPE html>
<html lang="en">
    <head>

        <script src="../validate.js"></script>
        <style>
    #redbox{
        background-color:red;
        height:100px;
        width:100px;
        border:2px black solid;

        background-color:blue;
        height:100px;

        background-color:green;
        height:100px;

        padding-left:20px;
